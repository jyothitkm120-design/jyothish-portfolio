<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111a16"/>
      <stop offset="60%" stop-color="#0a0f0d"/>
      <stop offset="100%" stop-color="#050807"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf451"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#84cc16" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Outer Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="32" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Glowing Aura Orbs -->
  <circle cx="200" cy="180" r="220" fill="#84cc16" opacity="0.09" filter="blur(60px)"/>
  <circle cx="1020" cy="460" r="240" fill="#84cc16" opacity="0.08" filter="blur(70px)"/>

  <!-- Left Monogram Card (Squircle) -->
  <g transform="translate(100, 155)">
    <rect width="320" height="320" rx="74" fill="#0d1412" stroke="url(#borderGrad)" stroke-width="6"/>
    <!-- Beacon Dot -->
    <circle cx="270" cy="55" r="16" fill="#84cc16" opacity="0.3" filter="url(#beaconGlow)"/>
    <circle cx="270" cy="55" r="9" fill="url(#limeGrad)"/>
    <circle cx="270" cy="55" r="4" fill="#ffffff"/>
    
    <!-- JD Shape -->
    <!-- J -->
    <path d="M 104 86 L 140 86 L 140 178 A 48 48 0 0 1 44 178 L 44 152 L 80 152 L 80 178 A 12 12 0 0 0 104 178 Z" fill="#ffffff"/>
    <!-- D -->
    <path d="M 162 86 L 202 86 A 68 70 0 0 1 202 226 L 162 226 Z M 196 120 L 162 120 L 162 120 A 34 36 0 0 1 196 192 Z" fill="url(#limeGrad)" fill-rule="evenodd"/>
  </g>

  <!-- Right Typography & Meta -->
  <g transform="translate(480, 160)">
    <!-- Pill Badge -->
    <g transform="translate(0, 15)">
      <rect width="330" height="36" rx="18" fill="#141f1a" stroke="#84cc16" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="22" cy="18" r="4.5" fill="#84cc16" filter="url(#beaconGlow)"/>
      <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#84cc16" letter-spacing="2">DIGITAL MARKETER &amp; STRATEGIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">Jyothish Digital Marketer</text>
    
    <!-- Tagline -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#a1a1aa">High-Performance Growth, SEO &amp; Creative Design</text>

    <!-- Pills Grid: Services -->
    <g transform="translate(0, 220)">
      <!-- Pill 1: SEO -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="10" fill="#18221d" stroke="#27382f"/>
        <text x="14" y="23" font-family="monospace" font-size="12" font-weight="700" fill="#d4d4d8">SEO in Kozhikode</text>
      </g>
      <!-- Pill 2: Graphic Design -->
      <g transform="translate(192, 0)">
        <rect width="170" height="36" rx="10" fill="#18221d" stroke="#27382f"/>
        <text x="14" y="23" font-family="monospace" font-size="12" font-weight="700" fill="#d4d4d8">Graphic Design</text>
      </g>
      <!-- Pill 3: Web Dev -->
      <g transform="translate(374, 0)">
        <rect width="180" height="36" rx="10" fill="#18221d" stroke="#27382f"/>
        <text x="14" y="23" font-family="monospace" font-size="12" font-weight="700" fill="#d4d4d8">Web Development</text>
      </g>
    </g>

    <!-- Footer URL -->
    <g transform="translate(0, 290)">
      <text x="0" y="18" font-family="monospace" font-size="16" font-weight="700" fill="#84cc16">www.jyothishv.in</text>
      <text x="175" y="18" font-family="monospace" font-size="14" font-weight="500" fill="#71717a">| Kozhikode, Kerala</text>
    </g>
  </g>
</svg>
