<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d19"/>
      <stop offset="50%" stop-color="#0d1412"/>
      <stop offset="100%" stop-color="#060908"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#84cc16" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Live Growth Radar Beacon -->
  <circle cx="410" cy="105" r="26" fill="#84cc16" opacity="0.35" filter="url(#beaconGlow)"/>
  <circle cx="410" cy="105" r="14" fill="url(#limeGrad)"/>
  <circle cx="410" cy="105" r="6" fill="#ffffff"/>

  <!-- Monogram JD -->
  <!-- "J" Shape in Crisp Brilliant White -->
  <path d="M 164 138
           L 222 138
           L 222 284
           A 76 76 0 0 1 70 284
           L 70 244
           L 128 244
           L 128 284
           A 18 18 0 0 0 164 284
           Z"
        fill="#ffffff"/>

  <!-- "D" Shape in Electric Neon Lime -->
  <path d="M 256 138
           L 318 138
           A 106 111 0 0 1 318 360
           L 256 360
           Z
           M 310 192
           L 256 192
           L 256 192
           A 52 57 0 0 1 310 306
           Z"
        fill="url(#limeGrad)"
        fill-rule="evenodd"/>
</svg>